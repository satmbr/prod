{% extends "base.html" %}
{% block title %}Equipamentos · Cadastro{% endblock %}

{% block content %}
<div class="page-wrap">

  <section class="zone">
    <header class="zone-head" data-target="#eq-cadastrar">
      <div class="zone-left">
        <span class="zone-icon">💡</span>
        <div class="zone-title">Cadastro de Equipamento</div>
      </div>
      <div class="zone-actions">
        <button type="button" class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" fill="#16324F"/></svg></button>
        <button type="button" class="icon-btn caret">▾</button>
      </div>
    </header>
    <div class="zone-body collapsed" id="eq-cadastrar">
      <form method="post" action="{{ url_for('equipamentos.equip_create') }}" class="grid grid-4">
        <label class="field">
          <span>Código *</span>
          <input required name="codigo" type="text" placeholder="ex.: EQ-001">
        </label>
        <label class="field">
          <span>Nome *</span>
          <input required name="nome" type="text" placeholder="ex.: Retroescavadeira">
        </label>
        <label class="field">
          <span>Tipo</span>
          <input name="tipo" type="text" placeholder="ex.: Pesado">
        </label>
        <div class="field align-end">
          <button class="btn primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </section>

  <section class="zone">
    <header class="zone-head" data-target="#eq-editar">
      <div class="zone-left">
        <span class="zone-icon">💡</span>
        <div class="zone-title">Editar Equipamento</div>
      </div>
      <div class="zone-actions">
        <button type="button" class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" fill="#16324F"/></svg></button>
        <button type="button" class="icon-btn caret">▾</button>
      </div>
    </header>
    <div class="zone-body collapsed" id="eq-editar">
      <form method="post" action="{{ url_for('equipamentos.equip_update') }}" class="grid grid-4">
        <label class="field">
          <span>Selecionar *</span>
          <select required name="id">
            <option value="">-- selecione --</option>
            <!-- depois populamos via banco -->
          </select>
        </label>
        <label class="field">
          <span>Novo nome</span>
          <input name="nome" type="text" placeholder="Novo nome">
        </label>
        <label class="field">
          <span>Novo tipo</span>
          <input name="tipo" type="text" placeholder="Novo tipo">
        </label>
        <div class="field align-end">
          <button class="btn" type="submit">Atualizar</button>
        </div>
      </form>
    </div>
  </section>

  <section class="zone">
    <header class="zone-head" data-target="#eq-excluir">
      <div class="zone-left">
        <span class="zone-icon">💡</span>
        <div class="zone-title">Excluir Equipamento</div>
      </div>
      <div class="zone-actions">
        <button type="button" class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z" fill="#16324F"/></svg></button>
        <button type="button" class="icon-btn caret">▾</button>
      </div>
    </header>
    <div class="zone-body collapsed" id="eq-excluir">
      <form method="post" action="{{ url_for('equipamentos.equip_delete') }}" class="grid grid-2">
        <label class="field">
          <span>Selecionar *</span>
          <select required name="id">
            <option value="">-- selecione --</option>
            <!-- depois populamos via banco -->
          </select>
        </label>
        <div class="field align-end">
          <button class="btn danger" type="submit" onclick="return confirm('Excluir equipamento selecionado?');">Excluir</button>
        </div>
      </form>
    </div>
  </section>

  {% if msg %}
    <div class="alert">{{ msg }}</div>
  {% endif %}
</div>

<script>
  document.querySelectorAll('.zone-head').forEach(h => {
    h.addEventListener('click', (e) => {
      if (e.target.closest('.icon-btn') && !e.target.closest('.caret')) return;
      const sel = h.getAttribute('data-target');
      const body = document.querySelector(sel);
      const caret = h.querySelector('.caret');
      if (body) body.classList.toggle('collapsed');
      if (caret) caret.textContent = (caret.textContent.trim() === '▴') ? '▾' : '▴';
    });
  });
</script>
{% endblock %}
