<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Enviar orçamento</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body style="background:#eef3f7"><main style="max-width:1000px;margin:24px auto;padding:16px">{% include "fornecedores/_styles.html" %}{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="fn-alert">{{ m }}</div>{% endfor %}{% endwith %}<div class="fn-head"><div><a href="{{ url_for('portal_fornecedor.detalhe', solicitacao_id=destino.solicitacao_id) }}">← Voltar</a><h1>Orçamento · {{ destino.numero }}</h1><p>{{ destino.titulo }}</p></div></div><form method="post" enctype="multipart/form-data" class="fn-panel"><div class="fn-panel-head"><h2>Itens do orçamento</h2><button type="button" class="fn-btn small" onclick="adicionarItem()">+ Adicionar item</button></div><div class="fn-table-wrap"><table class="fn-table" id="itens"><thead><tr><th>Descrição</th><th>Unidade</th><th>Quantidade</th><th>Valor unitário</th><th></th></tr></thead><tbody></tbody></table></div><div class="fn-panel-body fn-form-grid"><div class="fn-field full"><label>Observações e condições comerciais</label><textarea name="observacoes" placeholder="Prazo de execução, validade da proposta, condições de pagamento e demais observações"></textarea></div><div class="fn-field full"><label>Imagens ou documentos do orçamento</label><input type="file" name="anexos" accept=".pdf,.jpg,.jpeg,.png" multiple></div></div><div class="fn-panel-head"><a class="fn-btn" href="{{ url_for('portal_fornecedor.detalhe', solicitacao_id=destino.solicitacao_id) }}">Cancelar</a><button class="fn-btn primary">Enviar orçamento</button></div></form></main><template id="linha"><tr><td><input name="descricao" required placeholder="Serviço ou material"></td><td><input name="unidade" value="UN" required></td><td><input name="quantidade" value="1" required></td><td><input name="valor_unitario" placeholder="0,00" required></td><td><button type="button" class="fn-btn small danger" onclick="this.closest('tr').remove()">×</button></td></tr></template><script>function adicionarItem(){document.querySelector('#itens tbody').append(document.querySelector('#linha').content.cloneNode(true))}adicionarItem();document.querySelectorAll('form[method="post"]').forEach(f=>{const i=document.createElement('input');i.type='hidden';i.name='csrf_token';i.value=document.querySelector('meta[name="csrf-token"]').content;f.appendChild(i)})</script></body></html>
