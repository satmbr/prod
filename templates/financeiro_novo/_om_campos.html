<div class="dsp-form-grid">
  <label><span>Número da OM *</span><input name="numero_om" maxlength="80" required value="{{ om.numero_om if om else '' }}" placeholder="Ex.: 123/2026"></label>
  <label><span>Matrícula do favorecido *</span><input name="matricula_favorecido" maxlength="40" required value="{{ om.matricula_favorecido if om else '' }}"></label>
  <label><span>Favorecido *</span><select name="solicitante_id" required><option value="">Selecione</option>{% for p in opcoes.favorecidos %}<option value="{{ p.id }}" {% if om and om.solicitante_id==p.id %}selected{% endif %}>{{ p.nome_razao }}</option>{% endfor %}</select></label>
  <label><span>Centro de custo *</span><select name="centro_custo_id" required><option value="">Selecione</option>{% for c in opcoes.centros %}<option value="{{ c.id }}" {% if om and om.centro_custo_id==c.id %}selected{% endif %}>{{ c.codigo }} · {{ c.nome }}</option>{% endfor %}</select></label>
  <label><span>Moeda *</span><select name="moeda_id" required><option value="">Selecione</option>{% for m in opcoes.moedas %}<option value="{{ m.id }}" {% if om and om.moeda_id==m.id %}selected{% endif %}>{{ m.codigo }} · {{ m.nome }}</option>{% endfor %}</select></label>
  <label class="span-2"><span>Observações</span><textarea name="observacoes" rows="3">{{ om.observacoes if om and om.observacoes else '' }}</textarea></label>
</div>
