<div class="dsp-form-grid">
  <label><span>Solicitante / favorecido *</span><select name="solicitante_id" required><option value="">Selecione</option>{% for p in opcoes.favorecidos %}<option value="{{ p.id }}" {% if om and om.solicitante_id==p.id %}selected{% endif %}>{{ p.nome_razao }}</option>{% endfor %}</select></label>
  <label><span>Centro de custo *</span><select name="centro_custo_id" required><option value="">Selecione</option>{% for c in opcoes.centros %}<option value="{{ c.id }}" {% if om and om.centro_custo_id==c.id %}selected{% endif %}>{{ c.codigo }} · {{ c.nome }}</option>{% endfor %}</select></label>
  <label><span>Moeda *</span><select name="moeda_id" required><option value="">Selecione</option>{% for m in opcoes.moedas %}<option value="{{ m.id }}" {% if om and om.moeda_id==m.id %}selected{% endif %}>{{ m.codigo }} · {{ m.nome }}</option>{% endfor %}</select></label>
  <label><span>Adiantamento</span><input name="valor_adiantamento" inputmode="decimal" value="{{ ('%.2f'|format(om.valor_adiantamento)|replace('.',',')) if om else '0,00' }}"></label>
  <label class="span-2"><span>Objetivo *</span><input name="objetivo" maxlength="250" required value="{{ om.objetivo if om else '' }}"></label>
  <label><span>Origem *</span><input name="origem" maxlength="150" required value="{{ om.origem if om else '' }}"></label><label><span>Destino *</span><input name="destino" maxlength="150" required value="{{ om.destino if om else '' }}"></label>
  <label><span>Início *</span><input type="date" name="data_inicio" required value="{{ om.data_inicio.isoformat() if om else '' }}"></label><label><span>Fim *</span><input type="date" name="data_fim" required value="{{ om.data_fim.isoformat() if om else '' }}"></label>
  <label class="span-2"><span>Observações</span><textarea name="observacoes" rows="3">{{ om.observacoes or '' if om else '' }}</textarea></label>
</div>
