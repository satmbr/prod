{% extends "base.html" %}{% block title %}{{ 'Editar' if nd else 'Nova' }} Nota de Débito{% endblock %}{% block content %}<div class="page-wrap dsp-page narrow"><div class="homolog-banner"><strong>NOVO FINANCEIRO · HOMOLOGAÇÃO</strong><span>Nota de Débito manual</span></div><section class="zone"><header class="zone-head"><div class="zone-title">{{ 'Editar' if nd else 'Nova' }} Nota de Débito</div></header><div class="zone-body"><form method="post"><div class="dsp-form-grid"><label><span>Cliente *</span><select name="cliente_id" required><option value="">Selecione</option>{% for c in opcoes.clientes %}<option value="{{ c.id }}" {% if nd and nd.cliente_id==c.id %}selected{% endif %}>{{ c.nome_razao }}</option>{% endfor %}</select></label><label><span>Centro de custo *</span><select name="centro_custo_id" required><option value="">Selecione</option>{% for c in opcoes.centros %}<option value="{{ c.id }}" {% if nd and nd.centro_custo_id==c.id %}selected{% endif %}>{{ c.codigo }} · {{ c.nome }}</option>{% endfor %}</select></label><label><span>Moeda *</span><select name="moeda_id" required>{% for m in opcoes.moedas %}<option value="{{ m.id }}" {% if nd and nd.moeda_id==m.id %}selected{% endif %}>{{ m.codigo }} · {{ m.nome }}</option>{% endfor %}</select></label><label><span>Emissão *</span><input type="date" name="data_emissao" required value="{{ nd.data_emissao.isoformat() if nd else '' }}"></label><label><span>Vencimento *</span><input type="date" name="data_vencimento" required value="{{ nd.data_vencimento.isoformat() if nd else '' }}"></label><label class="span-2"><span>Descrição *</span><input name="descricao" maxlength="250" required value="{{ nd.descricao if nd else '' }}"></label><label class="span-2"><span>Observações</span><textarea name="observacoes">{{ nd.observacoes or '' if nd else '' }}</textarea></label></div><div class="dsp-actions"><button class="btn btn-primary">Salvar</button><a class="btn btn-outline" href="{{ url_for('financeiro_novo.nd_detalhe',nd_id=nd.id) if nd else url_for('financeiro_novo.notas_debito') }}">Voltar</a></div></form></div></section></div>{% include "financeiro_novo/_despesa_estilos.html" %}{% endblock %}
