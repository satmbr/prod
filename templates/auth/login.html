{% extends "base.html" %}
{% block title %}Login | PRUMAT ERP{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:420px;width:100%;">

    <div style="text-align:center;margin-bottom:24px;">
      <img src="{{ url_for('static', filename='logo-prumat.png') }}" alt="PRUMAT"
           style="height:48px;object-fit:contain;margin-bottom:14px;">
      <h2 style="color:var(--brand-blue);margin:0 0 4px;">Acesso ao Sistema</h2>
      <div class="text-muted text-sm">Informe seu usuário e senha para continuar</div>
    </div>

    <div class="zone">
      <div class="zone-body" style="padding:24px;">
        <form method="post" action="{{ url_for('auth.login') }}">
          <div style="margin-bottom:14px;">
            <label class="form-label" for="username">Usuário</label>
            <input type="text" id="username" name="username" required autofocus
                   class="form-control" style="height:38px;">
          </div>

          <div style="margin-bottom:20px;">
            <label class="form-label" for="senha">Senha</label>
            <div style="display:flex;gap:6px;">
              <input type="password" id="senha" name="senha" required
                     class="form-control" style="height:38px;">
              <button type="button" id="toggleSenha" class="btn btn-outline" style="flex-shrink:0;width:72px;">
                Mostrar
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;height:38px;font-size:13px;">
            Entrar
          </button>
        </form>
      </div>
    </div>

  </div>
</div>

<script>
(function(){
  const senha = document.getElementById('senha');
  const botao = document.getElementById('toggleSenha');
  if(senha && botao){
    botao.addEventListener('click', function(){
      const vis = senha.type === 'text';
      senha.type = vis ? 'password' : 'text';
      botao.textContent = vis ? 'Mostrar' : 'Ocultar';
    });
  }
})();
</script>
{% endblock %}
