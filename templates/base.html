<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{% block title %}PRUMAT{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="header">
  <div class="header-top">
    <div class="brand">
      <img src="{{ url_for('static', filename='img/logo-prumat.png') }}" alt="Consórcio PRUMAT">
      <div class="brand-title">Consórcio PRUMAT</div>
    </div>
    <div class="nav-right">
      <a class="nav-link" href="#user">{{ current_user_name }}</a>
      <a class="nav-link" href="#help">HELP</a>
    </div>
  </div>

  <nav class="header-nav">
    <div class="nav-left">
      <a class="home-icon" title="Home" href="{{ url_for('index') }}">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg>
      </a>
      <!-- Menu principal; Produção/Registro/Cadastro também aparecem no subnav -->
      <a class="nav-link" href="{{ url_for('operacao_producao') }}">Produção</a>
      <a class="nav-link" href="{{ url_for('operacao_registro') }}">Registro</a>
      <a class="nav-link" href="{{ url_for('operacao_cadastro') }}">Cadastro</a>
    </div>
  </nav>

  <div class="divider"></div>

  {% if subnav_links %}
  <div class="subnav">
    {% for item in subnav_links %}
      <a class="subnav-link{% if item.active %} active{% endif %}" href="{{ item.href }}">{{ item.text }}</a>
    {% endfor %}
  </div>
  {% endif %}
</header>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
