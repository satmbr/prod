{% extends "base.html" %}

{% block title %}Cadastro de Colaborador{% endblock %}

{% block content %}

<style>
    .section-card {
        border-left: 4px solid #f2c200;
        border-radius: 6px;
        margin-bottom: 1rem;
    }

    .section-card .card-header {
        background-color: #fff;
        border-bottom: 1px solid #eee;
        padding: 0.4rem 0.9rem;
    }

    .section-card .card-header h6 {
        margin: 0;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        font-size: 0.85rem;
    }

    .section-card .card-body {
        padding: 0.75rem 0.9rem 0.9rem 0.9rem;
    }

    .form-label {
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 0.1rem;
    }

    .form-control,
    .form-select {
        font-size: 0.8rem;
        padding: 0.25rem 0.4rem;
        height: 30px;
    }

    .form-text {
        font-size: 0.7rem;
    }

    .page-title-icon {
        font-size: 1.4rem;
        margin-right: 0.4rem;
        color: #5b2a0a;
    }

    @media (max-width: 768px) {
        .form-control,
        .form-select {
            font-size: 0.78rem;
        }
    }
</style>

<div class="container-fluid mt-3">

    <!-- Título -->
    <div class="d-flex align-items-center mb-3">
        <span class="page-title-icon">
            <i class="bi bi-people-fill"></i>
        </span>
        <h4 class="mb-0">Cadastro de Colaborador</h4>
    </div>

    <form method="POST" action="{{ url_for('colaboradores.registro_create') }}">
        <div class="row">

            <!-- COLUNA ESQUERDA -------------------------------------------------->
            <div class="col-md-6">

                <!-- DADOS PESSOAIS -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>DADOS PESSOAIS</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label class="form-label" for="nome">Nome *</label>
                            <input type="text" id="nome" name="nome"
                                   class="form-control" required>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="matricula">Matrícula *</label>
                                <input type="text" id="matricula" name="matricula"
                                       class="form-control" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="data_nascimento">Data de Nascimento</label>
                                <input type="date" id="data_nascimento" name="data_nascimento"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="estado_civil">Estado Civil</label>
                                <input type="text" id="estado_civil" name="estado_civil"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="escolaridade">Escolaridade</label>
                                <input type="text" id="escolaridade" name="escolaridade"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="cpf">CPF</label>
                                <input type="text" id="cpf" name="cpf"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="rg">RG</label>
                                <input type="text" id="rg" name="rg"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="telefone">Telefone</label>
                                <input type="tel" id="telefone" name="telefone"
                                       class="form-control" placeholder="(00) 00000-0000">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="numero_pix">Número PIX</label>
                                <input type="text" id="numero_pix" name="numero_pix"
                                       class="form-control" placeholder="Chave PIX">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- DOCUMENTOS -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>DOCUMENTOS</h6>
                    </div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="cnh">CNH</label>
                                <input type="text" id="cnh" name="cnh"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="vencimento_cnh">Vencimento CNH</label>
                                <input type="date" id="vencimento_cnh" name="vencimento_cnh"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="ctps">CTPS</label>
                                <input type="text" id="ctps" name="ctps"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="pis">PIS</label>
                                <input type="text" id="pis" name="pis"
                                       class="form-control">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FAMÍLIA E ESCOLARIDADE -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>FAMÍLIA</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label class="form-label" for="nome_mae">Nome da Mãe</label>
                            <input type="text" id="nome_mae" name="nome_mae"
                                   class="form-control">
                        </div>

                        <div class="mb-2">
                            <label class="form-label" for="nome_pai">Nome do Pai</label>
                            <input type="text" id="nome_pai" name="nome_pai"
                                   class="form-control">
                        </div>

                        <div class="mb-2">
                            <label class="form-label" for="cidade_nascimento">Cidade de Nascimento</label>
                            <input type="text" id="cidade_nascimento" name="cidade_nascimento"
                                   class="form-control">
                        </div>
                    </div>
                </div>

            </div>

            <!-- COLUNA DIREITA --------------------------------------------------->
            <div class="col-md-6">

                <!-- ENDEREÇO -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>ENDEREÇO</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label class="form-label" for="endereco">Endereço</label>
                            <input type="text" id="endereco" name="endereco"
                                   class="form-control">
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="cep">CEP</label>
                                <input type="text" id="cep" name="cep"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="mao_obra">Mão de Obra</label>
                                <input type="text" id="mao_obra" name="mao_obra"
                                       class="form-control" placeholder="Própria, terceirizada, etc.">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CONTRATO E FUNÇÃO -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>CONTRATO E FUNÇÃO</h6>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <label class="form-label" for="funcao">Função</label>
                            <input type="text" id="funcao" name="funcao"
                                   class="form-control">
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="data_admissao">Data Admissão</label>
                                <input type="date" id="data_admissao" name="data_admissao"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="data_funcao">Data na Função</label>
                                <input type="date" id="data_funcao" name="data_funcao"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="situacao_folha">Situação na Folha</label>
                                <input type="text" id="situacao_folha" name="situacao_folha"
                                       class="form-control" placeholder="Ativo, afastado, etc.">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="contrato">Contrato</label>
                                <input type="text" id="contrato" name="contrato"
                                       class="form-control" placeholder="CLT, PJ, aprendiz…">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="escala">Escala</label>
                                <input type="text" id="escala" name="escala"
                                       class="form-control" placeholder="5x2, 6x1…">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="salario">Salário</label>
                                <input type="number" step="0.01" id="salario" name="salario"
                                       class="form-control">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- JORNADA E FÉRIAS -->
                <div class="card section-card shadow-sm">
                    <div class="card-header">
                        <h6>JORNADA E FÉRIAS</h6>
                    </div>
                    <div class="card-body">
                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="horario_inicio">Horário Início</label>
                                <input type="time" id="horario_inicio" name="horario_inicio"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="horario_fim">Horário Fim</label>
                                <input type="time" id="horario_fim" name="horario_fim"
                                       class="form-control">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-6">
                                <label class="form-label" for="inicio_ferias">Início Férias</label>
                                <input type="date" id="inicio_ferias" name="inicio_ferias"
                                       class="form-control">
                            </div>
                            <div class="col-6">
                                <label class="form-label" for="fim_ferias">Fim Férias</label>
                                <input type="date" id="fim_ferias" name="fim_ferias"
                                       class="form-control">
                            </div>
                        </div>
                    </div>
                </div>

            </div> <!-- /col-md-6 direita -->

        </div> <!-- /row -->

        <div class="text-end mt-3">
            <button type="submit" class="btn btn-primary btn-sm px-4">
                Salvar
            </button>
        </div>
    </form>
</div>

{% endblock %}
